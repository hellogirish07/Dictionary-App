<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>GK Words - A Dictionary App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css" class="css">
</head>

<body class="p-4 md:p-8 flex justify-center min-h-screen">
  <div class="w-full max-w-2xl">
    <!-- Header Section -->
    <header class="text-center mb-8">
      <div class="flex flex-row gap-2 text-center justify-center items-center mb-2">
        <img src="/img/Logo.png" alt="Logo GK" />
        <h1
          class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300 mb-2">
          GK Words
        </h1>
      </div>
      <p class="text-slate-400 text-sm">Your modern English-Hindi Dictionary App</p>
    </header>

    <!-- Search Box -->
    <div class="glass-card rounded-3xl p-2 mb-8 flex items-center gap-2">
      <input id="wordInput" type="text" placeholder="Search a word..."
        class="search-input flex-1 py-3 px-6 rounded-2xl outline-none text-lg text-white" autocomplete="off" />

      <button id="searchBtn"
        class="bg-blue-600 hover:bg-blue-500 text-white font-bold h-12 w-12 md:w-auto md:px-8 rounded-2xl transition-all flex items-center justify-center shadow-lg shadow-blue-900/20">
        <span class="hidden md:inline">Search</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:hidden" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <!-- Dynamic Results Area -->
    <div id="status" class="text-center py-4 hidden"></div>

    <main id="result" class="space-y-6 hidden">
      <!-- Main Content Injected by JS -->
    </main>

  </div>
  <script src="script.js"></script>
</body>

</html>
